<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📚 Complete Session History - Mission GATE 2027</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="history.css">
</head>
<body>
  <div class="container">
    
    <!-- Top Banner Header -->
    <header class="top-banner history-header">
      <div class="title-section">
        <h1>📚 Complete Session History Archive</h1>
        <p class="subtitle">Monthly & weekly breakdown with interactive 7-day row heatmaps</p>
      </div>
      <div class="header-actions">
        <a href="/" class="btn primary back-link">← Back to Dashboard</a>
      </div>
    </header>

    <!-- Dynamic Month & Week Grouped History Container -->
    <main id="weekly-history-container" class="weekly-archive-container">
      <section class="card">
        <p class="text-center">Loading complete history archive...</p>
      </section>
    </main>

  </div>

  <!-- Floating Tooltip for Row Heatmap Tiles -->
  <div id="history-heatmap-tooltip" class="heatmap-tooltip hidden"></div>

  <script src="history.js"></script>
</body>
</html>
