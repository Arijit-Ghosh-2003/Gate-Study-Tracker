<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📚 Complete Session History - Mission GATE 2027</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="history.css">
</head>
<body>
  <div class="container">
    
    <!-- Top Banner Header -->
    <header class="top-banner history-header">
      <div class="title-section">
        <h1>📚 Complete Session History Archive</h1>
        <p class="subtitle">All logged study and exam practice sessions</p>
      </div>
      <div class="header-actions">
        <a href="/" class="btn primary back-link">← Back to Dashboard</a>
      </div>
    </header>

    <!-- Complete History Table Card -->
    <section class="card history-card">
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Date & Time</th>
              <th>Mode & Subject</th>
              <th>Topic / Chapter & Platform</th>
              <th>Type & Goal</th>
              <th>Active Duration</th>
              <th>Target vs Actual Variance</th>
              <th>Break / Interruption Logs</th>
            </tr>
          </thead>
          <tbody id="full-history-tbody">
            <tr><td colspan="7" class="text-center">Loading complete history...</td></tr>
          </tbody>
        </table>
      </div>
    </section>

  </div>

  <script src="history.js"></script>
</body>
</html>
